<!DOCTYPE html>
<html>
<head>
    <title>Pokemon Batte</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato|Roboto|Roboto+Condensed|Roboto+Mono" >
    <link rel='stylesheet' type='text/css' href='./loading-bar/loading-bar.css'>    
    <link rel="stylesheet" type="text/css" media="screen" href="poke.css">
    <script type='text/javascript' src='./loading-bar/loading-bar.js'></script>
    <script type='text/javascript' src='pokemon.js'></script>
</head>
<body>
    <div class='container'>
        <form>
            <fieldset class='trainer'>
                <legend>Create your trainer and Party</legend>
    
                <label for='firstName'>First Name</label>
                <input type='text' placeholder='First Name' name='firstName' id='firstName'>
    
                <br>
    
                <label for='lastName'>Last Name</label>
                <input type='text' placeholder='Last Name' name='lastName' id='lastName'>
    
                <br><br>
    
                <label for='trainerType'>Trainer Type</label>
                <select name='trainerType' id='trainerType'>
                    <option value='bug_catcher'>Bug Catcher</option>
                    <option value='biker'>Biker</option>
                    <option value='hiker'>Hiker</option>
                    <option value='bird_keeper'>Bird Keeper</option>
                    <option value='blackbelt'>Blackbelt</option>
                    <option value='burglar'>Burglar</option>
                    <option value='lass'>Lass</option>
                    <option value='youngster'>Youngster</option>
                    <option value='fisherman'>Fisherman</option>
                    <option value='super_nerd'>Super Nerd</option>
                    <option value='bird_keeper'>Bird Keeper</option>
                    <option value='beauty'>Beauty</option>
                </select>
    
                <br><br>
    
                <label for='partyOne'>First Pokemon</label>
                <select name='partyOne' id='partyOne'>
                    <option value='0'>Bulbasaur</option>
                    <option value='1'>Charmander</option>
                    <option value='2'>Squirtle</option>
                    <option value='3'>Pidgey</option>
                    <option value='4'>Rattata</option>
                    <option value='5'>Spearow</option>
                    <option value='6'>Ekans</option>
                    <option value='7'>Pikachu</option>
                </select>
                
                <br>
    
                <label for='partyTwo'>Second Pokemon</label>
                <select name='partyTwo' id='partyTwo'>
                    <option value='0'>Bulbasaur</option>
                    <option value='1'>Charmander</option>
                    <option value='2'>Squirtle</option>
                    <option value='3'>Pidgey</option>
                    <option value='4'>Rattata</option>
                    <option value='5'>Spearow</option>
                    <option value='6'>Ekans</option>
                    <option value='7'>Pikachu</option>
                </select>
    
                <br>
    
                <label for='partyThree'>Third Pokemon</label>
                <select name='partyThree' id='partyThree'>
                    <option value='0'>Bulbasaur</option>
                    <option value='1'>Charmander</option>
                    <option value='2'>Squirtle</option>
                    <option value='3'>Pidgey</option>
                    <option value='4'>Rattata</option>
                    <option value='5'>Spearow</option>
                    <option value='6'>Ekans</option>
                    <option value='7'>Pikachu</option>
                </select>
            </fieldset>
            <br>
            <button id='goBattle' type='button' onclick='Battle()'>Go Battle!</button>
        </form>
        <br><br>

        <div id='battle'>
            <div class='sides'>
                <div class='mySide side'>
                    <div>
                        <img id='mySprite' class='trainerSprite' src='' />
                        <p id='myName'></p>
                        <div id='myWinsLosses'>
                            <p>Wins: <span id='myWins'></span></p>
                            <p>Losses: <span id='myLosses'></span></p>
                        </div>
                    </div>
                    
                    <div class='myParty party'>
                        <div id='myPokemon1' class='pokemon'>
                            <img id='myPokemonImg1' src='' />
                            <p id='myPokemonName1'></p>
                            <div id="myPokemonHP1"></div>
                        </div>

                        <div id='myPokemon2' class='pokemon'>
                            <img id='myPokemonImg2' src='' />
                            <p id='myPokemonName2'></p>
                            <div id="myPokemonHP2"></div>
                        </div>

                        <div id='myPokemon3' class='pokemon'>
                            <img id='myPokemonImg3' src='' />
                            <p id='myPokemonName3'></p>
                            <div id="myPokemonHP3"></div>
                        </div>
                    </div>
                </div>

                <div class='displays'>
                    <div id='myDisplay' class='display'>
                        <h3>Your move</h3>
                        <p id='myMove'></p>
                        <p id='myEffectiveness'></p>
                        <p id='myExtra'></p>
                        <p id='myFainted'></p>
                    </div>
                    <div id='oppDisplay' class='display'>
                        <h3>Their move</h3>
                        <p id='oppMove'></p>
                        <p id='oppEffectiveness'></p>
                        <p id='oppExtra'></p>
                        <p id='oppFainted'></p>
                    </div>
                    <div id='overallDisplay' class='display'>
                        <h3>Results</h3>
                        <p id='overallDisplayText'></p>
                    </div>
                </div>
                

                <div class="oppSide side">
                    <div class='oppParty party'>
                        <div id="oppPokemon1" class="pokemon">
                            <img id='oppPokemonImg1' src='' />
                            <p id='oppPokemonName1'></p>
                            <div id="oppPokemonHP1"></div>
                        </div>
                        <div id="oppPokemon2" class="pokemon">
                            <img id='oppPokemonImg2' src='' />
                            <p id='oppPokemonName2'></p>
                            <div id="oppPokemonHP2"></div>
                        </div>
                        <div id="oppPokemon3" class="pokemon">
                            <img id='oppPokemonImg3' src='' />
                            <p id='oppPokemonName3'></p>
                            <div id="oppPokemonHP3"></div>
                        </div>
                    </div>
                    <div>
                        <img id='oppSprite' class='trainerSprite' src='' />
                        <p id='oppName'></p>
                        <div id='oppWinsLosses'>
                            <p>Wins: <span id='oppWins'></span></p>
                            <p>Losses: <span id='oppLosses'></span></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class='moves'>
                <button onclick='attack()' name='btnAttack' id='btnAttack' style="visibility: hidden;">Attack!</button>
            </div>

            <div class='restart hidden'>
                <button onclick='restart()' name='btnRestart' id='btnRestart' style="visibility: hidden;">Restart</button>
            </div>
        </div>
    </div>
    <script>
        const MAX_POKEMON_INDEX = 2
        const NAME_INPUTS_SELECTOR = 'fieldset.trainer input[type="text"]'
        const TEAM_ROCKET_IMG_PATH = './images/Team_Rocket.png'
        const TEAM_ROCKET_STR = 'Team Rocket'
        const TEAM_ROCKET_TEAM_SIZE = 3
        const TEAM_STR = 'Team'
        const ROCKET_STR = 'Rocket'

        class Person {
            constructor(firstName, lastName) {
                this.firstName = firstName
                this.lastName = lastName
            }
        }

        class Pokemon {
            constructor(name, type, image) {
                this.name = name
                this.type = type
                this.image = image
            }
            healthPower = 100
            updateHP(healthPower) {
                // ldBar(`#${prefix}PokemonHP${i+1}`).set(trainer.party[i].healthPower)
            }
        }

        class Trainer extends Person {
            constructor(firstName, lastName, type) {
                super();
                this.type = type
            }
            party = []
            currPokemon = {}
            currPokemonIndex = 0
            wins = 0
            losses = 0
            nextPokemon() {
                this.currPokemonIndex += 1
                if (this.currPokemonIndex > MAX_POKEMON_INDEX) {
                    this.currPokemonIndex = null
                }
            }
            clearParty() {
                this.party = [] // reset the party
            }
            addPokemonToParty(pokemon) {
                this.party.push(pokemon)
            }
        }

        // ***********************************************************
        // ***********************************************************
        // ********  HERE ARE THE GLOBAL TRAINER OBJECTS  ************
        // ***********************************************************
        // ***********************************************************
        const myTrainer = new Trainer()
        const oppTrainer = new Trainer(TEAM_STR, ROCKET_STR, TEAM_ROCKET_STR)

        function Battle() {
            // on start

            // read inputs
            let inputs = document.querySelectorAll(NAME_INPUTS_SELECTOR)
            let badInputs = Object.values(inputs).map(elem => {
                if (!elem.value) {
                    return elem
                }
            })
            badInputs = badInputs.filter(elem => elem) // remove all undefined elems (the good ones)

            if (badInputs.length > 0) {
                badInputs.forEach(badInput => {
                    badInput.style = 'border: 2px solid red'
                })
                badInputs[0].focus()
                return 1
            }

                // Attack displayed
            document.getElementById('btnAttack').style = 'visibility: block'
                // Restart hidden
            document.getElementsByClassName('restart')[0].className = 'restart' // need both of these to hide/show it
            document.getElementById('btnRestart').style = 'visibility: block'

            // read inputs
            let firstName = document.getElementById('firstName').value
            document.getElementById('firstName').removeAttribute('style') // reset the error border style edits, if any
            let lastName = document.getElementById('lastName').value
            document.getElementById('lastName').removeAttribute('style')
            let trainerType = document.getElementById('trainerType').value

            party = []
            let pokemon_inputs = document.querySelectorAll('select[name*="party"]')
            pokemon_inputs.forEach(thing => {
                let data = pokemonArray[thing.value]
                party.push(new Pokemon(data[0], data[1], data[2])) // create & add new Pokemon objects into party arr
            })

            myTrainer.party = party


            // load team rocket's pokemon
            party = []
            for (let i = 0; i < TEAM_ROCKET_TEAM_SIZE; i++) {
                let data = pokemonArray[Math.floor(Math.random() * pokemonArray.length)]
                party.push(new Pokemon(data[0], data[1], data[2]))

            }

            oppTrainer.party = party

            myTrainer.firstName = firstName
            myTrainer.lastName = lastName
            myTrainer.type = trainerType

            loadTrainer(myTrainer, false)
            loadTrainer(oppTrainer, true)




            // on end
                // Attack hidden
            // document.getElementById('btnAttack').style = 'visibility: hidden'
            //     // Restart displayed
            // document.getElementsByClassName('restart')[0].className = 'restart hidden' // need both of these to hide/show it
            // document.getElementById('btnRestart').style = 'visibility: hidden'


        }

        function attack() {
            alert(`Your info is: ${myTrainer.firstName} ${myTrainer.lastName} ${myTrainer.type}`)
        }

        function restart() {
            myTrainer.wins = 0
            myTrainer.losses = 0
            oppTrainer.wins = 0
            oppTrainer.losses = 0
        }

        function loadTrainer(trainer, isCPU = false) {
            const MY_PREFIX = 'my'
            const OPP_PREFIX = 'opp'
            // let party = []
            // let pokemon_inputs = []
            let prefix = isCPU ? OPP_PREFIX : MY_PREFIX

            document.querySelector(`#${prefix}Wins`).innerHTML = trainer.wins
            document.querySelector(`#${prefix}Losses`).innerHTML = trainer.losses
            document.querySelector(`#${prefix}Sprite`).setAttribute('src', isCPU ? TEAM_ROCKET_IMG_PATH : `./images/${trainer.type}.png`)
            for (let i = 0; i < document.querySelectorAll(`[id^=${prefix}Pokemon].pokemon`).length; i++) { // load images & health bars
                document.querySelector(`[id^=${prefix}PokemonImg${i+1}]`).setAttribute('src', `${trainer.party[i].image}`)
                ldBar(`#${prefix}PokemonHP${i+1}`).set(trainer.party[i].healthPower)
            }
        }

    </script>
</body>
</html>
